[build-system]
requires = ["poetry-core==2.1.3"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
requires-poetry = "2.1.3"
name = "api_generation"
version = "0.0.0"
description = ""
authors = []

source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]


[tool.poetry.dependencies]
python = ">=3.14,<4"
jinja2 = "^3.1.6"
msgspec = "^0.20.0"  # field types of hiveio_api, imported by the generator from the source tree of the package
hiveio-api-client = {version = ">=1.7.1.post20261105045512,<2", source = "gitlab-hive"}  # runtime of the clients of hiveio_api, imported from its source tree too
hiveio-api-client-generator = {version = "1.7.1.post20261106022200", source = "gitlab-hive"}  # first stable release exporting ApiDescription from api_client_generator.json_rpc
ruff = "^0.17.2"  # formats and tidies the generated hiveio_api - not a dependency of hiveio-api-client-generator
