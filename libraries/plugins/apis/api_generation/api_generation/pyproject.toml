[build-system]
requires = ["poetry-core==2.1.3"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
requires-poetry = "2.1.3"
name = "api_generation"
version = "0.0.0"
description = ""
authors = []

source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "primary" },
]


[tool.poetry.dependencies]
python = ">=3.14,<4"
jinja2 = "^3.1.6"
hiveio-schemas = {version = "1.28.2.dev20261009130646", source = "gitlab-hive"}  # NOTE: Also update hiveio_api/pyproject.toml when changing this version
hiveio-api-client-generator = {version = "1.7.1.dev20261009131048+unstable", source = "gitlab-hive"}
