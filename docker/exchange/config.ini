# hived configuration for an exchange node: consensus plus account history for the
# accounts the published exchange snapshot carries history for (listed below).
# Listening endpoints and directories are set by the container; do not set them here.

log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_milliseconds"} {"appender":"p2p","file":"logs/p2p/p2p.log","time_format":"iso_8601_milliseconds"}
log-logger = {"name":"default","level":"info","appender":"stderr"} {"name":"user","level":"debug","appender":"stderr"} {"name":"p2p","level":"warn","appender":"p2p"}

backtrace = yes

plugin = webserver p2p json_rpc
plugin = database_api condenser_api
plugin = account_by_key account_by_key_api
plugin = account_history_rocksdb account_history_api
plugin = transaction_status transaction_status_api
plugin = block_api network_broadcast_api rc_api
plugin = wallet_bridge_api
plugin = node_status_api
plugin = state_snapshot

# Accounts whose history is kept, as ["from","to"] name ranges, one line per account.
# This is the list the published exchange snapshot was made with, so a node started
# from that snapshot has their full history. If your account is here, keep the list
# as it is. If it is not, the snapshot cannot provide its history: add it and
# bootstrap from the block log instead (in .env: SNAPSHOT_URL empty, BLOCK_LOG_URL
# set). Without any range hived records history for every account on the chain,
# which needs far more disk and a much longer replay. Changing the list later
# requires a replay from a block log (HIVED_EXTRA_ARGS=--force-replay in .env for
# one start).
account-history-rocksdb-track-account-range = ["binance-hot","binance-hot"]
account-history-rocksdb-track-account-range = ["bittrex","bittrex"]
account-history-rocksdb-track-account-range = ["blocktrades","blocktrades"]
account-history-rocksdb-track-account-range = ["deepcrypto8","deepcrypto8"]
account-history-rocksdb-track-account-range = ["binance6","binance6"]
account-history-rocksdb-track-account-range = ["binance8","binance8"]
account-history-rocksdb-track-account-range = ["binance-hot2","binance-hot2"]
account-history-rocksdb-track-account-range = ["bdhivesteem","bdhivesteem"]
account-history-rocksdb-track-account-range = ["bgcryptotest","bgcryptotest"]
account-history-rocksdb-track-account-range = ["hot1.dunamu","hot1.dunamu"]
account-history-rocksdb-track-account-range = ["hot2.dunamu","hot2.dunamu"]
account-history-rocksdb-track-account-range = ["hot3.dunamu","hot3.dunamu"]
account-history-rocksdb-track-account-range = ["hot4.dunamu","hot4.dunamu"]
account-history-rocksdb-track-account-range = ["hot5.dunamu","hot5.dunamu"]
account-history-rocksdb-track-account-range = ["user.dunamu","user.dunamu"]
account-history-rocksdb-track-account-range = ["huobi-pro","huobi-pro"]
account-history-rocksdb-track-account-range = ["hive.fund","hive.fund"]
account-history-rocksdb-track-account-range = ["steem.dao","steem.dao"]
account-history-rocksdb-track-account-range = ["gtg","gtg"]
account-history-rocksdb-track-account-range = ["bitgethive","bitgethive"]
account-history-rocksdb-track-account-range = ["cold.dunamu","cold.dunamu"]
account-history-rocksdb-track-account-range = ["gateiodeposit","gateiodeposit"]
account-history-rocksdb-track-account-range = ["htx-deposit-1","htx-deposit-1"]
account-history-rocksdb-track-account-range = ["htx-withdraw-1","htx-withdraw-1"]
account-history-rocksdb-track-account-range = ["mxchive","mxchive"]
account-history-rocksdb-track-account-range = ["upbitshotwallet1","upbitshotwallet1"]
account-history-rocksdb-track-account-range = ["upbitshotwallet2","upbitshotwallet2"]
account-history-rocksdb-track-account-range = ["upbitshotwallet3","upbitshotwallet3"]
account-history-rocksdb-track-account-range = ["upbitsusers","upbitsusers"]
account-history-rocksdb-path = "blockchain/account-history-rocksdb-storage"

# Keep the block log as a single file. Published block logs are monolithic, and
# converting one to the split layout would need as much free space again. A node
# bootstrapped from SNAPSHOT_URL alone keeps no block log at all; the container then
# passes block-log-split=0 on the command line, which takes precedence over this line.
block-log-split = -1

# State file size. The file is sparse, so only the ~5 GB in use occupies disk (or RAM,
# on a tmpfs). Uncomment the two lines below to let hived grow it by 10% when it runs
# short of free space (not enabled by default yet).
shared-file-size = 8G
# shared-file-full-threshold = 9500
# shared-file-scale-rate = 1000

webserver-thread-pool-size = 8
