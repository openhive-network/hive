# hived configuration for an exchange node: consensus plus account history for the
# exchange's own accounts. Edit the tracked accounts below before the first start.
# Listening endpoints and directories are set by the container; do not set them here.

log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_milliseconds"} {"appender":"p2p","file":"logs/p2p/p2p.log","time_format":"iso_8601_milliseconds"}
log-logger = {"name":"default","level":"info","appender":"stderr"} {"name":"user","level":"debug","appender":"stderr"} {"name":"p2p","level":"warn","appender":"p2p"}

backtrace = yes

plugin = webserver p2p json_rpc
plugin = database_api condenser_api
plugin = account_by_key account_by_key_api
plugin = account_history_rocksdb account_history_api
plugin = transaction_status transaction_status_api
plugin = block_api network_broadcast_api rc_api
plugin = wallet_bridge_api
plugin = node_status_api
plugin = state_snapshot

# Accounts whose history is kept, as ["from","to"] name ranges; repeat the line for
# each account. Without any range hived records history for every account on the
# chain, which needs far more disk and a much longer replay. Changing this later
# requires a replay (HIVED_EXTRA_ARGS=--force-replay in .env for one start).
account-history-rocksdb-track-account-range = ["your-exchange","your-exchange"]
account-history-rocksdb-path = "blockchain/account-history-rocksdb-storage"

# Keep the block log as a single file. Published block logs are monolithic, and
# converting one to the split layout would need as much free space again. A node
# bootstrapped from SNAPSHOT_URL alone keeps no block log at all; the container then
# passes block-log-split=0 on the command line, which takes precedence over this line.
block-log-split = -1

# State file: starts at this size and grows by 10% whenever it is 95% full. The file
# is sparse, so only the ~5 GB in use occupies disk (or RAM, on a tmpfs).
shared-file-size = 8G
shared-file-full-threshold = 9500
shared-file-scale-rate = 1000

webserver-thread-pool-size = 8
