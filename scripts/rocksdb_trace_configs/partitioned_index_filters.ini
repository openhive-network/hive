# Two level index and partitioned filters in 16 KiB partitions, as hived lays them out with a block
# cache below 1 GiB: only the top level stays in the block cache, the partitions are cached like
# data blocks.
[TableOptions/BlockBasedTable]
index_type = kTwoLevelIndexSearch
partition_filters = true
metadata_block_size = 16384
