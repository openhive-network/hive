# Profile for hive/hive, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hive

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/hive"
  id: 198

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/haf), so `stable` is omitted and `aidev release`
# never moves develop or master.
branches:
  integration: "aidev/integration"
  handoff: "develop"
  # develop is fast-forward only and takes a linear history (doc/git-guidelines.md, #897): the hand-off MR
  # carries a one-commit-per-change copy of integration (aidev#16344); drop this line for integration's own commits
  handoff_history: "linear"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/hive/aidev-tests@sha256:11dfc04a5011bb69e0bf202363e53e44989f691f5c994ee83f7ea5e45a76a92a"
  inputs: [".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Every check compiles the candidate (hived is C++; nothing runs without a
# build), so each slot starts with `build`, which shares CI's sccache Redis
# through this one-service stack. See .aidev/README.md.
sandbox:
  compose: ".aidev/sccache-relay.compose.yml"
  services: [sccache]
  resource_class: light
  readiness_timeout: 60

# Verification slots. Each binding is what this project genuinely runs for
# that slot - never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Unbound for now: `static` (CI's only static check is pre-commit over the
# Python test tools), `system`, and the Python functional tests other than the
# cli_wallet pattern tests (`full`'s `wallet_patterns`): the rest of test-tools,
# the 5M block-log fixtures and the fork/colony jobs stay in GitLab CI.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "build", "chain-smoke", "plugin-api"]
    artifacts: ["test-results/quick/"]
    timeout: 900  # the quick cap; the slot takes ~5-8 min
  full:
    suites:
      # One build, then chain_test and plugin_test at the same time, each split
      # into parallel processes sharing HIVE_TEST_JOBS (run-checks.sh); witness_tests
      # (~15 min serially, aidev#15546) runs one process per case.
      - name: default
        adapter: command
        args: [".aidev/run-checks.sh", "full", "build", "chain-tests,plugin-tests"]
        artifacts: ["test-results/full/"]
        timeout: 1500
        memory: 40g
      # The tests/integration scripts the diff selects (.aidev/integration.sh),
      # beside `default`. Its select skips it, before AIDEV admits it into a
      # docker slot, when the diff selects no script it can run here; see
      # .aidev/README.md. The step ends itself by HIVE_INTEGRATION_BUDGET (this
      # suite's timeout; keep the two equal) and by what is left of the activity's.
      # The timeout is the most a suite gets: aidev's run_full_tests activity has
      # 40 min (2400 s, its retry_policy.yaml), and a suite's wall stops 300 s
      # short of it, so 2100 s. `default` (~10 min, capped at 1500 s) runs beside
      # this one, not before it, so the slot takes the longer of the two, within
      # the 2400 s. That fits one image and its scripts (mainnet 650-760 s and the
      # exchange script's 600 s); when both images and every selected script do
      # not fit, the plan defers the scripts that do not, by name.
      - name: integration
        adapter: command
        args: [".aidev/run-checks.sh", "full-integration", "integration"]
        artifacts: ["test-results/full-integration/"]
        env: {HIVE_AIDEV_INTEGRATION: "1", HIVE_INTEGRATION_BUDGET: "2100"}
        select: [".aidev/integration-select.sh"]
        concurrent: true
        docker: true
        stack: false
        timeout: 2100
        memory: 12g
      # CI's python_pattern_testnet_tests (the cli_wallet `help`/`gethelp` and output
      # patterns), after `default`, when the diff changes the wallet's API surface or
      # the patterns (.aidev/wallet-patterns-select.sh); see .aidev/README.md. A
      # suite's container keeps no other suite's build, so it builds its own testnet
      # hived, cli_wallet and get_dev_key from the compiler cache `default`'s build
      # filled (~4 min, then ~1 min of tests, on steem-5). That cache is reached
      # through the stack's relay, so the suite cannot be `concurrent` (which takes
      # `stack: false`), and its 900 s and `default`'s ~10 min (capped at 1500 s)
      # come out of run_full_tests' 2400 s one after the other. Skipped, not failed,
      # in an image without the test-tools environment (.aidev/runtime/Dockerfile).
      - name: wallet_patterns
        adapter: command
        args: [".aidev/run-checks.sh", "full-wallet-patterns", "wallet-patterns"]
        artifacts: ["test-results/full-wallet-patterns/"]
        select: [".aidev/wallet-patterns-select.sh"]
        timeout: 900
        memory: 16g
  baseline:
    # The same suite as `full`, run on the base; this slot's wall is sized from
    # its phase budget, so it takes no `timeout`. A list of one suite, under the
    # single binding's own name, because only a suite entry declares `memory`.
    suites:
      - name: default
        adapter: command
        args: [".aidev/run-checks.sh", "baseline", "build", "chain-tests,plugin-tests"]
        artifacts: ["test-results/baseline/"]
        memory: 40g
  # The promote gate: the merged candidate builds and its quick tests pass;
  # every workflow's `full` already ran all of chain_test and plugin_test.
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "build", "chain-smoke", "plugin-api"]
    artifacts: ["test-results/canary/"]
    timeout: 1500
  # No C++ coverage build: AIDEV runs `coverage` only in the post-implementation
  # scan, where it checks that the candidate builds and its quick tests pass.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "build", "chain-smoke", "plugin-api"]
    artifacts: ["test-results/coverage/"]

# Adaptive per-unit test timeouts (docs/operations/adaptive-timeouts.md in aidev):
# aidev hands each suite AIDEV_TIMEOUTS_FILE and collects AIDEV_TIMEOUTS_OBSERVATIONS;
# scripts/run_chain_tests_parallel.sh reads and writes them. See .aidev/README.md.
timeouts:
  enabled: true

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
