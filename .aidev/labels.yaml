# Issue-label taxonomy for hive/hive, written by
# `aidev project scaffold` (#13561). Deliberately the minimum the intake
# needs: aidev's own taxonomy encodes aidev's workflow, and imposing it on a
# project that has not asked for it is exactly the artifact onboarding tries
# not to push.
#
# `authority` is required on every label and has no default - see
# docs/architecture/issue-taxonomy.md for the three values.
version: 1

labels:
  - name: implement
    group: type
    color: "#1f75cb"
    description: "Implementation task (code change). implement + todo = approved for submit."
    authority: executive
  - name: bug
    group: type
    color: "#dd2b0e"
    description: "Defect in existing behaviour."
    authority: executive
  - name: feature
    group: type
    color: "#108548"
    description: "New capability."
    authority: executive
  - name: todo
    group: status
    color: "#ff9500"
    description: "Approved for automated work. The intake label this project's profile names."
    authority: executive
  - name: in-progress
    group: status
    color: "#c17d10"
    description: "A workflow is running against this issue."
    authority: machine
  - name: blocked
    group: status
    color: "#8b0000"
    description: "Dispatch is withheld by an unsatisfied dependency trailer."
    authority: machine
  - name: automated
    group: provenance
    color: "#bfbfbf"
    description: "Filed by an automated aidev process."
    authority: descriptive
  - name: high-level
    group: type
    color: "#6699cc"
    description: "Cohort parent and decomposition target (renames legacy 'meta'). high-level + todo = approved for decompose. Never combined with implement."
    authority: executive
  - name: documentation
    group: type
    color: "#0e8a16"
    description: "Docs-only change; bypasses tests and may merge straight to integration, so it receives the hard content check."
    authority: executive
  - name: devops
    group: type
    color: "#7f8c8d"
    description: "Operational workflow that changes system state, not code (analysis + fixups via aidev/OS commands, possibly filing issues). devops + todo = approved for devops-run. No promote/deploy lifecycle. Never combined with implement/high-level/analyze."
    authority: executive
  - name: analyze
    group: type
    color: "#0d5c63"
    description: "Read-only diagnosis of a specific problem under the analysis-only contract (#9034/#9056) — investigate and report, mutating nothing. analyze + todo = approved for analyze-run. No promote/deploy lifecycle. Never combined with implement/devops/high-level."
    authority: executive
  - name: optimization
    group: type
    color: "#AD8D43"
    description: "Performance, bundle-size or API-load improvement."
    authority: executive

exclusive_groups:
  - name: status
    labels: [todo, in-progress]
  - name: primary-type
    labels: [implement, high-level, devops, analyze]
