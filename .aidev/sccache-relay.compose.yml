# The one service the checks' stack starts: a relay to the site's sccache Redis
# AIDEV hands the stack as AIDEV_SCCACHE_REDIS_HOSTPORT, else to CI's
# (SCCACHE_REDIS in .gitlab-ci.yaml), so a check reaches the compiler cache as
# redis://sccache:6379 from the stack network. Without a stack the check container
# runs on `--network none` and every build would be cold (30-60 min).
# run-checks.sh probes the relay, builds without the shared cache when its Redis
# is unreachable from this host, and records which cache it used (sccache.tsv).
services:
  sccache:
    image: alpine/socat:1.8.0.3
    command: ["-d", "TCP-LISTEN:6379,fork,reuseaddr", "TCP:${AIDEV_SCCACHE_REDIS_HOSTPORT:-192.168.50.109:6379}"]
    healthcheck:
      test: ["CMD-SHELL", "pidof socat"]
      interval: 2s
      timeout: 2s
      retries: 15
