# The one service the checks' stack starts: a relay to the site's sccache Redis
# AIDEV hands the stack as AIDEV_SCCACHE_REDIS_HOSTPORT, else to CI's
# (SCCACHE_REDIS in .gitlab-ci.yaml), so a check reaches the compiler cache as
# redis://sccache:6379 from the stack network. Without a stack the check container
# runs on `--network none` and every build would be cold (30-60 min).
# Where AIDEV hands the stack a site WebDAV cache instead
# (AIDEV_SCCACHE_WEBDAV_ENDPOINT, served at its root), it also relays
# http://sccache:8090 to that cache's host:port, for a suite that is not handed
# the endpoint itself.
# run-checks.sh probes the WebDAV cache and then the relay, builds without the
# shared cache when none answers from this host, and records which cache it used
# (sccache.tsv).
services:
  sccache:
    image: alpine/socat:1.8.0.3
    entrypoint:
      - sh
      - -c
      - |
        redis="$$1" webdav="$${2#*://}"
        webdav="$${webdav%%/*}"
        if [ -n "$$webdav" ]; then
            case "$$webdav" in *:*) ;; *) webdav="$$webdav:80" ;; esac
            socat -d TCP-LISTEN:8090,fork,reuseaddr "TCP:$$webdav" &
        fi
        exec socat -d TCP-LISTEN:6379,fork,reuseaddr "TCP:$$redis"
      - sccache-relay
      - ${AIDEV_SCCACHE_REDIS_HOSTPORT:-192.168.50.109:6379}
      - ${AIDEV_SCCACHE_WEBDAV_ENDPOINT:-}
    healthcheck:
      test: ["CMD-SHELL", "pidof socat"]
      interval: 2s
      timeout: 2s
      retries: 15
